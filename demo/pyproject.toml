[project]
name = "django-qraft-demo"
version = "0.1.0"
description = "Self-verifying demo and end-to-end verification suite for django-qraft"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django>=6.0,<7.0",
    "django-q2>=1.10.0,<2.0.0",
    "django-qraft",
    "psycopg[binary,pool]>=3.1",
    "python-dotenv>=1.0",
]

[tool.uv.sources]
django-qraft = { path = "..", editable = true }
