[project]
name = "django-qraft-demo"
version = "0.1.0"
description = "Demo project for benchmarking Django-Qraft vs Django-Q2"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django>=6.0,<7.0",
    "django-q2>=1.8.0,<2.0",
    "django-qraft",
    "psycopg[binary,pool]>=3.1",  # PostgreSQL driver with connection pooling
    "python-dotenv>=1.0",    # .env file support
]

[tool.uv.sources]
django-qraft = { path = "..", editable = true }
