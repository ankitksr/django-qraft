name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        # uv.lock is deliberately not committed (library); key the cache on
        # pyproject.toml or setup-uv fails the whole job on the missing lock.
        cache-dependency-glob: "**/pyproject.toml"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --group test

    - name: Run linter
      run: |
        uv run ruff check qraft/

    - name: Run tests with coverage
      run: |
        uv run pytest --cov=qraft --cov-report=xml --cov-report=term --cov-fail-under=72 -n auto

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  test-postgres:
    # SQLite has no SKIP LOCKED and no real row locks, so the compare-and-swap
    # and select_for_update() guarantees are only proven here.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qraft
          POSTGRES_PASSWORD: qraft
          POSTGRES_DB: qraft
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qraft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --group test

    - name: Run the `postgres`-marked concurrency cases
      env:
        QRAFT_TEST_DATABASE_URL: postgresql://qraft:qraft@localhost:5432/qraft
      run: |
        uv run pytest -m postgres --create-db -p no:xdist
