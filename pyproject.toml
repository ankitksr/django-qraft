[project]
name = "django-qraft"
version = "1.0.0"
description = "Django-Qraft is a next-gen distributed task queue for Django"
authors = [
    {name = "Ankit Singh", email = "ankitksrdev@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "django>=4.2.0,<6.0.0",
    "django-q2>=1.8.0,<2.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qraft*"]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.1.3",
    "django-types>=0.20.0",
    "ruff>=0.12.5",
]
test = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
]

[tool.ruff]
target-version = "py312"
exclude = ["*/migrations/*", "tests/*"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--reuse-db",
    "--ds=tests.settings",
]
markers = [
    "django_db: mark test as requiring database access",
]

[tool.coverage.run]
source = ["qraft"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
