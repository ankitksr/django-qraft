[project]
name = "django-qraft"
version = "1.4.1"
description = "Durable background jobs and workflows for Django, on PostgreSQL, built on Django-Q2"
authors = [
    {name = "Ankit Singh", email = "ankitksrdev@gmail.com"}
]
license = "MIT"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10,<4.0"
keywords = ["django", "task-queue", "distributed", "workers", "retry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "django>=5.0.0,<7.0.0",
    "django-q2>=1.8.0,<2.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20"]

[project.urls]
Homepage = "https://github.com/ankitksr/django-qraft"
Repository = "https://github.com/ankitksr/django-qraft"
Issues = "https://github.com/ankitksr/django-qraft/issues"
Changelog = "https://github.com/ankitksr/django-qraft/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qraft*"]

[tool.setuptools.package-data]
"qraft.dashboard" = ["templates/qraft_dashboard/*.html"]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.1.3",
    "django-types>=0.20.0",
    "ruff>=0.12.5",
]
test = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "opentelemetry-api>=1.20",
    "psycopg[binary]>=3.1",
]

[tool.ruff]
target-version = "py310"
exclude = ["*/migrations/*", "tests/*"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--reuse-db",
    "--ds=tests.settings",
]
markers = [
    "django_db: mark test as requiring database access",
    "postgres: concurrency cases that need real row locks; skipped unless QRAFT_TEST_DATABASE_URL points at Postgres",
]

[tool.coverage.run]
source = ["qraft"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
